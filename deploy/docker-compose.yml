services:
  litellm:
    build: { context: .., dockerfile: deploy/Dockerfile }
    ports: ["4000:4000"]
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./router.yaml:/app/deploy/router.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on: [redis]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
