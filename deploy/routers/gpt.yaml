# Router `jev-auto-gpt`: the GPT-5.6 ladder. Schema: jev_router/core/config.py. Design: docs/IMPLEMENTATION_PLAN_v0.md.
#
# Every file in this directory is one router; the proxy serves them all at once and dispatches on
# the model name a request asks for (the `alias`). Deployments the tiers point at are shared and
# live in deploy/config.yaml. This file is the fully annotated one; the others note only what differs.
#
# Each turn is scored per tier as  utility = -lambda_cost * cost - lambda_quality * quality_risk - switch_cost
# and the highest utility wins. All three terms are in US dollars for *this turn*, so keep the constants
# below in proportion to what a turn actually costs (typically $0.001-0.05).

alias: jev-auto-gpt    # requests with this model name are routed; everything else passes through untouched
shadow: false          # true: compute and log the decision but serve from the alias's own deployment

objective:
  lambda_cost: 1.0     # weight on the turn's predicted dollar cost (input, cache reads, expected output)
  lambda_quality: 3.0  # weight on quality_risk; 3.0 means avoiding a one-level miss is worth ~$0.15 per unit probability

jev:
  model: jev-latest
  timeout_ms: 1500             # Jev unavailable or slow -> keep the incumbent (fail open)
  min_confidence: 0.55         # below this, Jev's required_tier is ignored and the incumbent is kept
  complaint_threshold: 0.85    # quality_complaint probability at which the router must move up at least one tier

cache_ttl_seconds: 300         # how long a provider prompt cache is assumed to survive between turns

# What Jev sees: the transcript is minimized to fit `budget_tokens`. Characters are per message.
state:
  budget_tokens: 8000
  current_message_chars: 6000
  recent_messages: 6
  recent_user_chars: 1500
  recent_assistant_chars: 800
  tool_result_chars: 300
  older_stubs: 20
  older_stub_chars: 120
  first_message_stub_chars: 400
  system_prompt_chars: 600
  routing_history_entries: 5
  filter: null                 # dotted path to a callable(state) -> state for teams with a redaction policy

# Dollar penalties for leaving the incumbent tier, on top of any lost cache reads.
switch_cost:
  base: 0.001                  # any switch
  continuity: 0.003            # scaled by Jev's continues_task * needs_history
  thinking_loss: 0.002         # changing model (the new model has none of the previous reasoning)
  cross_provider: 0.01         # changing provider

# quality_risk = sum over Jev's required_tier distribution of P(level) * tier_penalty[level - tier.level]
# for levels above the tier's. Index 0 is unused; 1..3 are the cost of being one, two, three levels short.
tier_penalty: [0, 0.05, 0.20, 0.60]

# Predicted output length by Jev's expected_output (short / medium / long), scaled per effort.
expected_output_tokens: [200, 800, 3000]
effort_output_multiplier: { low: 0.7, medium: 1.0, high: 1.5, xhigh: 2.5, max: 4.0 }

# The ladder. `model` is a deployment name from deploy/config.yaml; `level` is where the tier sits on
# Jev's 0-3 scale (trivial / routine / demanding / frontier). Order tiers cheapest first: a complaint
# moves to the next tier in this list. Pricing and capabilities come from LiteLLM's model registry.
tiers:
  - { name: luna-low,      model: luna,  effort: low,    level: 0 }
  - { name: luna-medium,   model: luna,  effort: medium, level: 1 }
  - { name: terra-low,     model: terra, effort: low,    level: 1 }
  - { name: terra-medium,  model: terra, effort: medium, level: 1 }
  - { name: terra-high,    model: terra, effort: high,   level: 2 }
  - { name: sol-medium,    model: sol,   effort: medium, level: 2 }
  - { name: sol-high,      model: sol,   effort: high,   level: 3 }
  - { name: sol-xhigh,     model: sol,   effort: xhigh,  level: 3 }
  # Claude tiers (haiku / sonnet / opus deployments in config.yaml) can be mixed in here; see
  # claude.yaml for a Claude-only ladder.
default: terra-medium          # used when Jev is unavailable on a fresh conversation, or no tier is eligible
