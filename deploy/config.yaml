# This is the configuration file for the JEV model router. It defines the available models, their parameters, and routing settings.
model_list:
  - model_name: luna
    litellm_params: { model: openai/gpt-5.6-luna, api_key: os.environ/OPENAI_API_KEY }
  - model_name: terra
    litellm_params: { model: openai/gpt-5.6-terra, api_key: os.environ/OPENAI_API_KEY }
  - model_name: sol
    litellm_params: { model: openai/gpt-5.6-sol, api_key: os.environ/OPENAI_API_KEY }
  - model_name: jev-auto
    litellm_params: { model: openai/gpt-5.6-terra, api_key: os.environ/OPENAI_API_KEY }

router_settings:
  fallbacks: [{ sol: [terra] }, { terra: [luna] }]

litellm_settings:
  callbacks: jev_router.litellm_plugin.proxy_handler_instance
  cache: true
  cache_params: { type: redis, host: redis, port: 6379 }
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
