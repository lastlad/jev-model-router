[project]
name = "jev-router"
version = "0.1.0"
description = "Jev-powered, cache-aware model router as a LiteLLM proxy plugin"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "litellm[proxy]==1.101.0",
    "typesafe-sdk>=0.7,<1",
    "pyyaml>=6",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff", "pyright"]

[project.scripts]
jev-router = "jev_router.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_router"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: boots a LiteLLM proxy with mock deployments and a fake Jev (deselect with -m 'not integration')"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
